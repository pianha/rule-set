
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://gh-proxy.com/https://github.com/Loyalsoldier/geoip/releases/latest/download/geoip.dat
  geosite: https://gh-proxy.com/https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
  mmdb: https://gh-proxy.com/https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

listeners:
  - name: us0-socks
    type: socks
    listen: 0.0.0.0
    port: 7891
    proxy: "🇺🇸 美国0"
    udp: true

  - name: us-split-mixed
    type: mixed
    listen: 0.0.0.0
    port: 7892
    udp: true

  - name: us1-socks
    type: socks
    listen: 0.0.0.0
    port: 7893
    proxy: "🇺🇸 美国1"
    udp: true

# 节点由订阅提供；不要在这里重复添加
proxies: []

proxy-groups:
  # 只用于测速查看；不要让业务组引用它
  - name: 节点测速
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false

  # 手动选择：不自动测速切换
  - name: 🇺🇸 美国0
    type: select
    proxies:
      - us0

  - name: 🇺🇸 美国1
    type: select
    proxies:
      - us1

  - name: 🤖 MuseAI
    type: select
    proxies:
      - 🇺🇸 美国0
      - 🇺🇸 美国1
      - DIRECT

  - name: 💬 ChatGPT
    type: select
    proxies:
      - 🇺🇸 美国0
      - 🇺🇸 美国1
      - DIRECT

  - name: 🇨🇳 国内直连
    type: select
    proxies:
      - DIRECT

  - name: 🚫 广告
    type: select
    proxies:
      - REJECT

  - name: 🚀 触动
    type: select
    proxies:
      - 🇺🇸 美国0
      - 🇺🇸 美国1
      - DIRECT

rules:
  - GEOSITE,private,🇨🇳 国内直连
  - GEOIP,private,🇨🇳 国内直连,no-resolve

  - GEOSITE,category-ads-all,🚫 广告

  - DOMAIN-SUFFIX,muse.ai,🤖 MuseAI
  - DOMAIN-SUFFIX,metaaivm.com,🤖 MuseAI

  - DOMAIN-SUFFIX,chatgpt.com,💬 ChatGPT
  - DOMAIN-SUFFIX,openai.com,💬 ChatGPT
  - DOMAIN-SUFFIX,oaistatic.com,💬 ChatGPT
  - DOMAIN-SUFFIX,oaiusercontent.com,💬 ChatGPT
  - DOMAIN-SUFFIX,sora.com,💬 ChatGPT
  - GEOSITE,openai,💬 ChatGPT

  - GEOSITE,cn,🇨🇳 国内直连
  - GEOIP,CN,🇨🇳 国内直连,no-resolve

  - GEOSITE,geolocation-!cn,🚀 触动
  - GEOIP,!CN,🚀 触动,no-resolve

  - MATCH,DIRECT
